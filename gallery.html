<p id="gallery-status">Loading photos…</p>

<div id="gallery-slideshow" class="gallery-slideshow" hidden>
  <img id="gallery-layer-1" class="gallery-slide" alt="Timberline Blazers gallery photo">
  <img id="gallery-layer-2" class="gallery-slide" alt="">
</div>

<script>
  const PHOTOPRISM_URL = "https://photos.tlblazers.com";
  const SHARE_TOKEN = "fu9r7cys9c";
  const ROTATION_INTERVAL = 6000;

  let photoUrls = [];
  let currentIndex = 0;
  let activeLayer = 1;

  const layer1 = document.getElementById("gallery-layer-1");
  const layer2 = document.getElementById("gallery-layer-2");
  const statusEl = document.getElementById("gallery-status");
  const slideshowEl = document.getElementById("gallery-slideshow");

  function photoHash(photo) {
    if (photo.Hash) return photo.Hash;
    if (photo.Files && photo.Files[0] && photo.Files[0].Hash) return photo.Files[0].Hash;
    return "";
  }

  async function fetchAlbumPhotos() {
    try {
      const sessionRes = await fetch(PHOTOPRISM_URL + "/api/v1/session", {
        method: "POST",
        headers: {
          Accept: "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ token: SHARE_TOKEN })
      });

      if (!sessionRes.ok) {
        throw new Error("Session error: " + sessionRes.status);
      }

      const session = await sessionRes.json();
      const sessionId = session.id;
      const previewToken = (session.config && session.config.previewToken) || "public";
      const albumUid = session.data && session.data.shares && session.data.shares[0];

      const photosUrl = new URL("/api/v1/photos", PHOTOPRISM_URL);
      photosUrl.searchParams.set("count", "100");
      photosUrl.searchParams.set("merged", "true");
      photosUrl.searchParams.set("order", "newest");
      if (albumUid) {
        photosUrl.searchParams.set("album", albumUid);
      }

      const photosRes = await fetch(photosUrl.toString(), {
        headers: {
          Accept: "application/json",
          "X-Session-ID": sessionId
        }
      });

      if (!photosRes.ok) {
        throw new Error("Photos error: " + photosRes.status);
      }

      const data = await photosRes.json();
      photoUrls = data
        .map(photoHash)
        .filter(Boolean)
        .map(function (hash) {
          return PHOTOPRISM_URL + "/api/v1/t/" + hash + "/" + previewToken + "/fit_2048";
        });

      if (photoUrls.length > 0) {
        statusEl.hidden = true;
        slideshowEl.hidden = false;
        startGallery();
      } else {
        statusEl.innerHTML = 'No photos found. <a href="' + PHOTOPRISM_URL + "/s/" + SHARE_TOKEN + '">Open the album</a>.';
      }
    } catch (error) {
      console.error("Failed to load photos from PhotoPrism:", error);
      statusEl.innerHTML = 'Could not load the gallery here. <a href="' + PHOTOPRISM_URL + "/s/" + SHARE_TOKEN + '">View photos on PhotoPrism</a>.';
    }
  }

  function updateSlide() {
    const nextUrl = photoUrls[currentIndex];
    const currentLayer = activeLayer === 1 ? layer1 : layer2;
    const nextLayer = activeLayer === 1 ? layer2 : layer1;

    const img = new Image();
    img.src = nextUrl;
    img.onload = function () {
      nextLayer.src = nextUrl;
      nextLayer.classList.add("active");
      currentLayer.classList.remove("active");

      activeLayer = activeLayer === 1 ? 2 : 1;
      currentIndex = (currentIndex + 1) % photoUrls.length;
    };
  }

  function startGallery() {
    updateSlide();
    setInterval(updateSlide, ROTATION_INTERVAL);
  }

  fetchAlbumPhotos();
</script>
