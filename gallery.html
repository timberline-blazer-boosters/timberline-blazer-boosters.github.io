<p id="gallery-status">Loading photos…</p>

<div id="gallery-slideshow" class="gallery-slideshow" hidden>
  <img id="gallery-layer-1" class="gallery-slide" alt="Timberline Blazers gallery photo">
  <img id="gallery-layer-2" class="gallery-slide" alt="">
  <button type="button" class="gallery-nav gallery-nav-prev" id="gallery-prev" aria-label="Previous photo">‹</button>
  <button type="button" class="gallery-nav gallery-nav-next" id="gallery-next" aria-label="Next photo">›</button>
</div>

<script>
  const PHOTOPRISM_URL = "https://photos.tlblazers.com";
  const SHARE_TOKEN = "fu9r7cys9c";
  const ROTATION_INTERVAL = 6000;

  let photos = [];
  let currentIndex = 0;
  let activeLayer = 1;
  let rotateTimer = null;

  const layer1 = document.getElementById("gallery-layer-1");
  const layer2 = document.getElementById("gallery-layer-2");
  const statusEl = document.getElementById("gallery-status");
  const slideshowEl = document.getElementById("gallery-slideshow");
  const prevBtn = document.getElementById("gallery-prev");
  const nextBtn = document.getElementById("gallery-next");

  function photoHash(photo) {
    if (photo.Hash) return photo.Hash;
    if (photo.Files && photo.Files[0] && photo.Files[0].Hash) return photo.Files[0].Hash;
    return "";
  }

  function isPortraitPhoto(photo, img) {
    if (photo && photo.Portrait === true) return true;

    const file = photo && photo.Files && photo.Files[0] ? photo.Files[0] : photo;
    const orientation = (file && file.Orientation) || (photo && photo.Orientation) || 1;
    const rotated = orientation === 5 || orientation === 6 || orientation === 7 || orientation === 8;
    const width = (file && file.Width) || (photo && photo.Width) || 0;
    const height = (file && file.Height) || (photo && photo.Height) || 0;

    if (width && height) {
      return rotated ? width > height : height > width;
    }

    if (file && file.AspectRatio && file.AspectRatio < 1) return true;

    if (img && img.naturalWidth && img.naturalHeight) {
      return img.naturalHeight > img.naturalWidth;
    }

    return false;
  }

  function setFrame(photo, img) {
    slideshowEl.classList.toggle("is-portrait", isPortraitPhoto(photo, img));
  }

  async function fetchAlbumPhotos() {
    try {
      const sessionRes = await fetch(PHOTOPRISM_URL + "/api/v1/session", {
        method: "POST",
        headers: {
          Accept: "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ token: SHARE_TOKEN })
      });

      if (!sessionRes.ok) {
        throw new Error("Session error: " + sessionRes.status);
      }

      const session = await sessionRes.json();
      const sessionId = session.id;
      const previewToken = (session.config && session.config.previewToken) || "public";
      const albumUid = session.data && session.data.shares && session.data.shares[0];

      const photosUrl = new URL("/api/v1/photos", PHOTOPRISM_URL);
      photosUrl.searchParams.set("count", "100");
      photosUrl.searchParams.set("merged", "true");
      photosUrl.searchParams.set("order", "newest");
      if (albumUid) {
        photosUrl.searchParams.set("album", albumUid);
      }

      const photosRes = await fetch(photosUrl.toString(), {
        headers: {
          Accept: "application/json",
          "X-Session-ID": sessionId
        }
      });

      if (!photosRes.ok) {
        throw new Error("Photos error: " + photosRes.status);
      }

      const data = await photosRes.json();
      photos = data
        .map(function (photo) {
          const hash = photoHash(photo);
          if (!hash) return null;
          return {
            photo: photo,
            url: PHOTOPRISM_URL + "/api/v1/t/" + hash + "/" + previewToken + "/fit_2048"
          };
        })
        .filter(Boolean);

      if (photos.length > 0) {
        showSlide(0, true);
        prevBtn.addEventListener("click", function () {
          showSlide(currentIndex - 1);
          startAutoplay();
        });
        nextBtn.addEventListener("click", function () {
          showSlide(currentIndex + 1);
          startAutoplay();
        });
        document.addEventListener("keydown", function (event) {
          if (slideshowEl.hidden) return;
          if (event.key === "ArrowLeft") {
            showSlide(currentIndex - 1);
            startAutoplay();
          } else if (event.key === "ArrowRight") {
            showSlide(currentIndex + 1);
            startAutoplay();
          }
        });
      } else {
        statusEl.innerHTML = 'No photos found. <a href="' + PHOTOPRISM_URL + "/s/" + SHARE_TOKEN + '">Open the album</a>.';
      }
    } catch (error) {
      console.error("Failed to load photos from PhotoPrism:", error);
      statusEl.innerHTML = 'Could not load the gallery here. <a href="' + PHOTOPRISM_URL + "/s/" + SHARE_TOKEN + '">View photos on PhotoPrism</a>.';
    }
  }

  function showSlide(index, reveal) {
    if (!photos.length) return;
    currentIndex = (index + photos.length) % photos.length;
    const item = photos[currentIndex];
    const nextUrl = item.url;
    const currentLayer = activeLayer === 1 ? layer1 : layer2;
    const nextLayer = activeLayer === 1 ? layer2 : layer1;

    setFrame(item.photo);

    const img = new Image();
    img.src = nextUrl;
    img.onload = function () {
      setFrame(item.photo, img);

      nextLayer.src = nextUrl;
      nextLayer.classList.add("active");
      currentLayer.classList.remove("active");
      activeLayer = activeLayer === 1 ? 2 : 1;

      if (reveal) {
        statusEl.hidden = true;
        slideshowEl.hidden = false;
        startAutoplay();
      }
    };
  }

  function startAutoplay() {
    if (rotateTimer) {
      clearInterval(rotateTimer);
    }
    rotateTimer = setInterval(function () {
      showSlide(currentIndex + 1);
    }, ROTATION_INTERVAL);
  }

  fetchAlbumPhotos();
</script>
