<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%}
              {{ site.author | escape }}
            {%- else -%}
              {{ site.title | escape }}
            {%- endif -%}
            </li>
            {%- if site.email -%}
            <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
            {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        {%- include social.html -%}
      </div>

      <div class="footer-col footer-col-3">
        <p>{{- site.description | escape -}}</p>
      </div>
    </div>

    <!-- GoatCounter visitor count -->
    <div class="footer-visitor-count" style="margin-top: 1em; font-size: 0.875em; color: #828282;">
      <span id="gc-visitor-count">Loading visitor count...</span>
    </div>

    <script>
      (function() {
        var attempts = 0;
        var maxAttempts = 50;
        
        function loadVisitorCount() {
          attempts++;
          
          if (window.goatcounter && window.goatcounter.visit_count) {
            window.goatcounter.visit_count({
              type: 'html',
              append: '#gc-visitor-count',
              path: 'TOTAL',
              no_branding: true,
              style: 'color: #828282; text-decoration: none;'
            });
          } else if (attempts < maxAttempts) {
            setTimeout(loadVisitorCount, 100);
          } else {
            document.getElementById('gc-visitor-count').textContent = '';
          }
        }
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadVisitorCount);
        } else {
          loadVisitorCount();
        }
      })();
    </script>

  </div>

</footer>
