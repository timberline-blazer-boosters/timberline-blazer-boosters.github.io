<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%}
              {{ site.author | escape }}
            {%- else -%}
              {{ site.title | escape }}
            {%- endif -%}
            </li>
            {%- if site.email -%}
            <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
            {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        {%- include social.html -%}
      </div>

      <div class="footer-col footer-col-3">
        <p>{{- site.description | escape -}}</p>
      </div>
    </div>

    <!-- GoatCounter analytics -->
    <script data-goatcounter="https://timberlineblazers.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>

    <!-- Visitor count: first-party JSON so Edge tracking prevention cannot hide it -->
    <div id="gc-visitor-count" class="footer-visitor-count" style="margin-top: 1em; font-size: 0.875em; color: #828282;"></div>

    <script>
      (function() {
        var el = document.getElementById('gc-visitor-count');
        if (!el) return;

        var localUrl = '{{ "/assets/data/visitor-count.json" | relative_url }}';
        var remoteUrl = 'https://timberlineblazers.goatcounter.com/counter/TOTAL.json';

        function show(data) {
          if (!data || data.count == null) throw new Error('missing count');
          el.textContent = data.count + ' site views';
        }

        function load(url) {
          return fetch(url, { cache: 'no-store' }).then(function(r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          });
        }

        load(localUrl).then(show).catch(function() {
          load(remoteUrl).then(show).catch(function() {
            el.remove();
          });
        });
      })();
    </script>

  </div>

</footer>
