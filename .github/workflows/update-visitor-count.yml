name: Update visitor count

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GoatCounter total
        run: |
          mkdir -p assets/data
          curl -fsS "https://timberlineblazers.goatcounter.com/counter/TOTAL.json" \
            -o assets/data/visitor-count.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visitor-count.json
          if git diff --staged --quiet; then
            echo "No count change"
          else
            git commit -m "Update GoatCounter visitor count"
            git push
          fi
