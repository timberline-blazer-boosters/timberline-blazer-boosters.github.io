title: Timberline Blazers Booster Club
description: Supporting Timberline High School athletics and activities
theme: minima
url: https://timberlineblazerboosters.org
lang: en
timezone: America/Los_Angeles
logo: /assets/images/logo.png

twitter:
  card: summary

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/logo.png
        alt: Timberline High School Blazers seal

header_pages:
  - about.html
  - membership.html
  - events.html
  - scholarships/index.html
  - documents.html
  - donate.html
  - gallery.html
  - contact.html

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

rss: rss

feed:
  path: /feed.xml
  posts_limit: 20
